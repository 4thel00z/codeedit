[project]
name = "codeedit"
version = "1.2.0"
description = "Structural code edits for coding agents: a better sed that reads the syntax tree"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []
keywords = ["tree-sitter", "refactoring", "codemod", "ast", "syntax-tree", "structural-search", "code-editing", "coding-agents", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Software Development",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Editors :: Text Processing",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/4thel00z/codeedit"
Source = "https://github.com/4thel00z/codeedit"
Issues = "https://github.com/4thel00z/codeedit/issues"
Changelog = "https://github.com/4thel00z/codeedit/blob/main/CHANGELOG.md"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
module-name = "codeedit.native"
python-source = "python"
features = ["pyo3/extension-module"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/*.rs" }, { file = "crates/**/Cargo.toml" }, { file = "vendor/**/*.c" }, { file = "vendor/**/*.h" }, { file = "vendor/**/*.rs" }]
